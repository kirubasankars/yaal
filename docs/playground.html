<style>
#playground textarea,
#playground select {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0.35rem 0 1rem;
  padding: 0.75rem;
  font: 0.9rem/1.45 ui-monospace, monospace;
  color: inherit;
  background: transparent;
  border: 1px solid #ccc;
  border-radius: 6px;
}
#playground label {
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
#playground pre.error {
  background: #3a1515;
}
@media (prefers-color-scheme: dark) {
  #playground textarea,
  #playground select {
    border-color: #444;
  }
}
</style>
<div id="playground">
<h1>Playground</h1>
<p>Pick an example, then edit the statement and the arguments. The compiler runs in this page.</p>
<label for="example">Example</label>
<select id="example">
  <optgroup label="Cases">
    <option value="optional">Optional filter</option>
    <option value="several">Several parameters</option>
    <option value="list">IN list</option>
    <option value="when">optional_when</option>
    <option value="groups">optional_groups_or</option>
    <option value="groupsAnd">optional_groups_and</option>
    <option value="groupList">Group list</option>
    <option value="sort">sort and dir</option>
    <option value="filterSort">Filter and sort</option>
  </optgroup>
  <optgroup label="Nested">
    <option value="whenGroups">when around or-groups</option>
    <option value="whenAndGroups">when around and-groups</option>
    <option value="whenInGroup">when inside a group</option>
    <option value="optionalGroup">optional around a group</option>
    <option value="optionalInGroup">optional inside a group</option>
    <option value="whenOptionalGroups">when, optional, and groups</option>
  </optgroup>
</select>
<label for="sql">SQL</label>
<textarea id="sql" rows="14" spellcheck="false"></textarea>
<label for="params">Arguments</label>
<textarea id="params" rows="10" spellcheck="false"></textarea>
<label for="placeholder">Placeholder</label>
<select id="placeholder">
  <option value="question">?</option>
  <option value="numbered">$1</option>
</select>
<p><strong>Result</strong></p>
<pre id="result"><code></code></pre>
</div>
<script type="module" src="playground.js"></script>
