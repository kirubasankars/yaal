name: Go

on:
  release:
    types: [published]

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches project
        shell: bash
        run: |
          PROJECT_VERSION=$(tr -d '[:space:]' < bindings/go/version.txt)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) does not match project version ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Build portable Linux library
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/io -w /io quay.io/pypa/manylinux_2_28_x86_64 bash -lc '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            cargo build -p yaal-ffi --release
          '

      - name: Build library
        if: runner.os != 'Linux'
        run: cargo build -p yaal-ffi --release

      - name: Unit tests
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) export YAAL_LIB="$PWD/target/release/yaal_ffi.dll" ;;
            macOS) export YAAL_LIB="$PWD/target/release/libyaal_ffi.dylib" ;;
            *) export YAAL_LIB="$PWD/target/release/libyaal_ffi.so" ;;
          esac
          (cd bindings/go && go test .)

      - name: Stage runtime
        shell: bash
        run: python bindings/go/stage.py

      - name: Test the staged library
        shell: bash
        run: python bindings/go/pack.py --no-stage

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: bindings/go/native/
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches project
        run: |
          PROJECT_VERSION=$(tr -d '[:space:]' < bindings/go/version.txt)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) does not match project version ($PROJECT_VERSION)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: bindings/go/native
          pattern: native-*
          merge-multiple: true

      - name: Test the packaged module
        run: python3 bindings/go/pack.py --no-stage --require linux-x64,osx-arm64,win-x64

      - name: Publish the module tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          tag="bindings/go/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "tag ${tag} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            bindings/go/native/linux-x64/libyaal_ffi.so \
            bindings/go/native/osx-arm64/libyaal_ffi.dylib \
            bindings/go/native/win-x64/yaal_ffi.dll
          git commit -m "Publish the Go module ${VERSION} with the native compilers."
          git tag "${tag}"
          git push origin "refs/tags/${tag}"
