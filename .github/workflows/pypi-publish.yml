name: PyPI

on:
  release:
    types: [published]

jobs:
  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches project
        shell: bash
        run: |
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) does not match project version ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Build portable Linux library
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/io -w /io quay.io/pypa/manylinux_2_28_x86_64 bash -lc '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            cargo build -p yaal-ffi --release
          '

      - name: Build library
        if: runner.os != 'Linux'
        run: cargo build -p yaal-ffi --release

      - name: Unit tests
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) export YAAL_LIB="$PWD/target/release/yaal_ffi.dll" ;;
            macOS) export YAAL_LIB="$PWD/target/release/libyaal_ffi.dylib" ;;
            *) export YAAL_LIB="$PWD/target/release/libyaal_ffi.so" ;;
          esac
          python bindings/python/test_yaal.py

      - name: Pack
        shell: bash
        run: |
          python -m pip install build wheel
          if [ "${{ runner.os }}" = "Linux" ]; then
            python bindings/python/pack.py --platform-tag linux_x86_64
            mkdir -p artifacts/repaired
            docker run --rm -v "$PWD":/io -w /io quay.io/pypa/manylinux_2_28_x86_64 \
              auditwheel repair artifacts/yaal_sql-*-linux_x86_64.whl -w /io/artifacts/repaired
            rm -f artifacts/yaal_sql-*-linux_x86_64.whl
            mv artifacts/repaired/*.whl artifacts/
            rmdir artifacts/repaired
          else
            python bindings/python/pack.py
          fi

      - name: Test the wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/yaal-wheel"
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="$RUNNER_TEMP/yaal-wheel/Scripts/python.exe"
          else
            PY="$RUNNER_TEMP/yaal-wheel/bin/python"
          fi
          "$PY" -m pip install artifacts/yaal_sql-*.whl
          cd "$RUNNER_TEMP"
          "$PY" -c "import os; os.environ.pop('YAAL_LIB', None); import yaal; print(yaal.compile('--(id)--\nselect {{id}}', {'id': 1})['statements'][0]['sql'])"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: artifacts/*.whl
          if-no-files-found: error

  publish:
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheel-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts
          skip-existing: true
