name: NuGet

on:
  release:
    types: [published]

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable Linux library
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/io -w /io quay.io/pypa/manylinux_2_28_x86_64 bash -lc '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            cargo build -p yaal-ffi --release
          '

      - name: Build library
        if: runner.os != 'Linux'
        run: cargo build -p yaal-ffi --release

      - name: Unit tests
        shell: bash
        run: |
          dotnet restore bindings/csharp/Yaal.Tests/Yaal.Tests.csproj
          case "${{ runner.os }}" in
            Windows) export YAAL_LIB="$PWD/target/release/yaal_ffi.dll" ;;
            macOS) export YAAL_LIB="$PWD/target/release/libyaal_ffi.dylib" ;;
            *) export YAAL_LIB="$PWD/target/release/libyaal_ffi.so" ;;
          esac
          dotnet run --project bindings/csharp/Yaal.Tests/Yaal.Tests.csproj --no-restore --nologo

      - name: Stage runtime
        shell: bash
        run: python bindings/csharp/stage.py

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: bindings/csharp/Yaal/runtimes/
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches project
        run: |
          PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' bindings/csharp/Yaal/Yaal.csproj)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) does not match project version ($PROJECT_VERSION)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: bindings/csharp/Yaal/runtimes
          pattern: native-*
          merge-multiple: true

      - name: Pack
        run: >
          dotnet pack bindings/csharp/Yaal/Yaal.csproj -c Release -o artifacts
          -p:ContinuousIntegrationBuild=true

      - name: Validate package
        run: |
          dotnet tool install --global dotnet-validate --version 0.0.1-preview.582
          shopt -s nullglob
          for pkg in ./artifacts/*.nupkg; do
            dotnet-validate package local "$pkg"
          done
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          package = next(Path("artifacts").glob("*.nupkg"))
          names = zipfile.ZipFile(package).namelist()
          required = [
              "runtimes/linux-x64/native/libyaal_ffi.so",
              "runtimes/osx-arm64/native/libyaal_ffi.dylib",
              "runtimes/win-x64/native/yaal_ffi.dll",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"{package} is missing {missing}")
          PY

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: kirubasankars

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
