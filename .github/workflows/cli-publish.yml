name: CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach CLI archives to, such as v1.1.0
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: linux-x64
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x64
            musl: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install musl
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.1.0"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches project
        shell: bash
        run: |
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/yaal-cli/Cargo.toml)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) does not match crates/yaal-cli/Cargo.toml ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Test
        shell: bash
        run: cargo test -p yaal-cli --locked

      - name: Build
        shell: bash
        run: cargo build -p yaal-cli --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="target/${{ matrix.target }}/release/yaal.exe"
          else
            bin="target/${{ matrix.target }}/release/yaal"
          fi
          python crates/yaal-cli/package.py \
            --target "${{ matrix.asset }}" \
            --binary "$bin" \
            --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset }}
          path: artifacts/yaal-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.1.0"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches project
        run: |
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/yaal-cli/Cargo.toml)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) does not match crates/yaal-cli/Cargo.toml ($PROJECT_VERSION)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true

      - name: Checksums
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd dist
          test -f "yaal-${VERSION}-linux-x64.tar.gz"
          test -f "yaal-${VERSION}-macos-arm64.tar.gz"
          test -f "yaal-${VERSION}-windows-x64.zip"
          sha256sum \
            "yaal-${VERSION}-linux-x64.tar.gz" \
            "yaal-${VERSION}-macos-arm64.tar.gz" \
            "yaal-${VERSION}-windows-x64.zip" \
            | sort -k2 > "yaal-${VERSION}-SHA256SUMS.txt"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            "dist/yaal-${VERSION}-linux-x64.tar.gz" \
            "dist/yaal-${VERSION}-macos-arm64.tar.gz" \
            "dist/yaal-${VERSION}-windows-x64.zip" \
            "dist/yaal-${VERSION}-SHA256SUMS.txt" \
            --clobber
