[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaal"
version = "0.10.0"
description = "SQL→JSON framework: descriptor-driven queries with nested output shaping"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Kiruba Sankar Swaminathan" }]
keywords = ["sql", "json", "database", "descriptors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9,<3"]
mysql = ["mysql-connector-python>=8.0,<10"]
clickhouse = ["clickhouse-driver>=0.2,<1"]
engines = [
    "psycopg2-binary>=2.9,<3",
    "mysql-connector-python>=8.0,<10",
    "clickhouse-driver>=0.2,<1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10",
]

[project.scripts]
yaal = "yaal_cli:main"

[project.urls]
Homepage = "https://github.com/kirubasankars/yaal"
Documentation = "https://kirubasankars.github.io/yaal/"

[tool.setuptools]
package-dir = {"" = "python/src"}
py-modules = [
    "yaal",
    "yaal_builder",
    "yaal_cli",
    "yaal_clickhouse",
    "yaal_drivers",
    "yaal_const",
    "yaal_errors",
    "yaal_executor",
    "yaal_mysql",
    "yaal_output_schema",
    "yaal_parser",
    "yaal_postgres",
    "yaal_precompile",
    "yaal_provider",
    "yaal_shape",
    "yaal_sqlite",
]
