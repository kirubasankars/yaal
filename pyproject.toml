[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yaal-sql"
version = "0.12.0"
description = "Yaal SQL compiler. Compiles Yaal SQL and a JSON parameter object into dialect SQL and ordered binds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Kiruba Sankar Swaminathan" }]
keywords = ["sql", "compiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kirubasankars/yaal"
Documentation = "https://kirubasankars.github.io/yaal/"
Repository = "https://github.com/kirubasankars/yaal"

[tool.setuptools]
package-dir = {"" = "bindings/python"}

[tool.setuptools.packages.find]
where = ["bindings/python"]
include = ["yaal*"]

[tool.setuptools.package-data]
yaal = ["*.so", "*.dylib", "*.dll"]
