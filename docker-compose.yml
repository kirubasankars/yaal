services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yaal
      POSTGRES_PASSWORD: yaal
      POSTGRES_DB: yaal
    ports:
      - "54329:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaal -d yaal"]
      interval: 2s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yaal
      MYSQL_USER: yaal
      MYSQL_PASSWORD: yaal
    ports:
      - "33069:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --sql-mode=ANSI_QUOTES,PIPES_AS_CONCAT,STRICT_TRANS_TABLES
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uyaal", "-pyaal"]
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: yaal
      CLICKHOUSE_USER: yaal
      CLICKHOUSE_PASSWORD: yaal
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  # .NET 8 SDK runner for csharp/ tests (no local SDK required).
  # Unit:        docker compose run --rm --no-deps dotnet-test
  # Integration: docker compose run --rm -e YAAL_INTEGRATION=1 dotnet-test
  dotnet-test:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src
    volumes:
      - .:/src
      - yaal-nuget:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      YAAL_INTEGRATION: "0"
      YAAL_PG_URL: postgresql://yaal:yaal@postgres:5432/yaal
      YAAL_MYSQL_URL: mysql://yaal:yaal@mysql:3306/yaal
      YAAL_CH_URL: clickhouse://yaal:yaal@clickhouse:8123/yaal
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    profiles: ["csharp"]
    command:
      - dotnet
      - test
      - csharp/tests/Yaal.Tests/Yaal.Tests.csproj
      - --verbosity
      - minimal

volumes:
  yaal-nuget:
